name: matrix

# Builds every guest (8 languages), builds every host (5 languages) and runs the full
# 5 x 8 matrix, one host language per job. Every cell must pass: STRICT=1 also fails on a
# host or guest that was not built.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guests:
    name: guest / ${{ matrix.lang }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: [c, nim, go, rust, zig, ocaml, haskell, fstar]
    steps:
      - uses: actions/checkout@v4

      # --- toolchains -------------------------------------------------------------------
      - name: clang + lld
        if: matrix.lang == 'c'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: "1.24"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.lang == 'rust'
        with:
          targets: wasm32-unknown-unknown

      - uses: mlugg/setup-zig@v2
        if: matrix.lang == 'zig'
        with:
          version: 0.16.0

      - uses: jiro4989/setup-nim-action@v2
        if: matrix.lang == 'nim'
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: wasi-sdk
        if: matrix.lang == 'nim' || matrix.lang == 'fstar'
        run: scripts/setup-wasi-sdk.sh

      # GHC's wasm backend, about 5 GB. guests/haskell/build.sh finds it in vendor/ghc-wasm.
      - name: GHC WebAssembly backend
        if: matrix.lang == 'haskell'
        run: scripts/setup-ghc-wasm.sh

      - uses: ocaml/setup-ocaml@v3
        if: matrix.lang == 'ocaml'
        with:
          ocaml-compiler: "5.3"

      - name: wasm_of_ocaml with the WASI target
        if: matrix.lang == 'ocaml'
        run: scripts/setup-wasm-of-ocaml.sh

      # F* release tarball: fstar.exe, KaRaMeL and Z3 in one download. No OCaml needed.
      - name: F* and KaRaMeL
        if: matrix.lang == 'fstar'
        run: scripts/setup-fstar.sh

      # --- build and check --------------------------------------------------------------
      - name: Build guest
        run: bash guests/${{ matrix.lang }}/build.sh

      - name: Inspect guest and check it against the contract with Node
        run: |
          node --no-warnings tools/inspect.mjs build/guests/${{ matrix.lang }}.wasm
          node --no-warnings tools/node-check.mjs build/guests/${{ matrix.lang }}.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: guest-${{ matrix.lang }}
          path: build/guests/${{ matrix.lang }}.wasm
          if-no-files-found: error

  hosts:
    name: host / ${{ matrix.lang }}
    needs: guests
    # Run even if a guest failed: the STRICT matrix then names the missing cells instead of
    # every host job being skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: [c, nim, go, rust, zig]
    steps:
      - uses: actions/checkout@v4

      # --- toolchains -------------------------------------------------------------------
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: "1.24"

      # The wasmtime crate 49 needs Rust 1.96 or newer (hosts/rust/Cargo.toml: rust-version).
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.lang == 'rust'

      - uses: mlugg/setup-zig@v2
        if: matrix.lang == 'zig'
        with:
          version: 0.16.0

      - uses: jiro4989/setup-nim-action@v2
        if: matrix.lang == 'nim'
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wasmtime C API
        if: matrix.lang == 'c' || matrix.lang == 'nim' || matrix.lang == 'zig'
        run: scripts/setup-wasmtime.sh

      # --- build and run ----------------------------------------------------------------
      - name: Build host
        run: bash hosts/${{ matrix.lang }}/build.sh

      # Hand-made good and bad modules: a host must report both outcomes correctly.
      - name: Self-test (rejects bad guests, accepts good ones)
        run: HOSTS=${{ matrix.lang }} scripts/selftest.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: guest-*
          path: build/guests
          merge-multiple: true

      - name: Run this host against all 8 guests
        run: HOSTS=${{ matrix.lang }} STRICT=1 scripts/run-matrix.sh
